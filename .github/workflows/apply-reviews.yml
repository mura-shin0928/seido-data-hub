name: Apply reviews

# 人が判定した移転先（data/reviews/*.json）を本番（Supabase）の DB に反映する。手で流す。
# 候補の URL を登録して巡回で取り、資源が active になった候補だけを反映する。流し方は docs/apply-reviews.md
on:
  workflow_dispatch:
    inputs:
      file:
        description: 判定のファイル
        default: data/reviews/2026-10-moves.json
        required: true
      dry_run:
        description: DB には書かず、件数だけを表示する
        type: boolean
        default: true

# 巡回と同時に走らせない（同じ URL を取り合わないように）
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  apply:
    # 巡回と同じ、DB と同じ東京の CodeBuild で動かす（作り方は docs/crawl-runner.md）
    runs-on: codebuild-seido-data-hub-crawl-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      FILE: ${{ inputs.file }}
      DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p pipeline
      - run: ./target/release/pipeline apply-reviews register "$FILE" $DRY_RUN
      # 登録したばかりの候補を取る。週の途中なら、ほかの URL はほとんど時刻が来ていない。試し流しでは取らない
      - id: crawl
        if: ${{ !inputs.dry_run }}
        run: ./target/release/pipeline crawl --kind reviews
      # 巡回が警告（全件失敗・429 の急増など）で失敗しても、反映は流す。反映するのは資源が active になった候補だけ
      - if: ${{ success() || steps.crawl.conclusion == 'failure' }}
        run: ./target/release/pipeline apply-reviews link "$FILE" $DRY_RUN
