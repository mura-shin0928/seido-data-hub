name: Crawl

# 本番（Supabase）への週1の巡回。時刻の来た URL だけを取る。手でも流せる。
# 警告（429・5xx の急増、全件失敗、変更率50%超、lease 切れの多発、応答が無い）に当たるとジョブが失敗する
on:
  schedule:
    # 毎週月曜 03:17 JST。毎時0分は起動が遅れやすいので分をずらす
    - cron: "17 18 * * 0"
  workflow_dispatch:

# 前の巡回が終わるまで次を待たせる（途中で止めない）。二重取得そのものは claim と lease が防ぐ
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build --release -p pipeline
      # 起動は毎回ずれるので、48時間以内に時刻の来る URL も取る（7日間隔の URL が1週飛ばないように）
      - run: ./target/release/pipeline crawl --kind "$KIND" --due-within-hours 48 --min-responses 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KIND: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
