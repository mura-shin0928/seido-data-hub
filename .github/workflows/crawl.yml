name: Crawl

# 本番（Supabase）への週1の巡回。段は、関連 URL の登録（link-related）→ 一覧ページの起点の登録（register-index）→ 巡回（crawl）→
# 移転先の候補づくり（suggest-moves。成果物 move-candidates）。手でも流せる。
# 警告（429・5xx の急増、全件失敗、変更率50%超（一覧ページを数えない）、lease 切れの多発、応答が無い、ホストごと見送り）に当たると、ジョブが失敗する。
# 移転先の候補が出ても警告ではない（失敗にしない）
on:
  schedule:
    # 毎週月曜 03:17 JST。毎時0分は起動が遅れやすいので分をずらす
    - cron: "17 18 * * 0"
  workflow_dispatch:

# 前の巡回が終わるまで次を待たせる（途中で止めない）。二重取得そのものは claim と lease が防ぐ
concurrency:
  group: crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    # DB（Supabase）と同じ東京の CodeBuild で動かし、1件ごとの DB との往復を短くする（作り方は docs/crawl-runner.md）
    runs-on: codebuild-seido-data-hub-crawl-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - id: build
        run: cargo build --release -p pipeline
      # 前回の巡回で主たる URL が死んだ制度に、関連 URL を結ぶ。続く巡回が生死を確かめる
      - id: link-related
        run: ./target/release/pipeline link-related
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 主たる URL の親ディレクトリを一覧ページの起点として登録する。起点から外れたものは巡回から外す
      - id: register-index
        run: ./target/release/pipeline register-index
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # 関連 URL・起点の登録が失敗しても巡回は流す（ジョブは失敗のまま残る）。ビルドの失敗では流さない
      # 起動は毎回ずれるので、48時間以内に時刻の来る URL も取る（7日間隔の URL が1週飛ばないように）
      - if: ${{ steps.build.conclusion == 'success' && !cancelled() }}
        run: ./target/release/pipeline crawl --kind "$KIND" --due-within-hours 48 --min-responses 1
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KIND: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
      # 巡回が警告で失敗しても候補は作る（DB を読むだけ）。月に1回、人が成果物を取って確かめる（docs/apply-reviews.md）
      - if: ${{ steps.build.conclusion == 'success' && !cancelled() }}
        run: ./target/release/pipeline suggest-moves --out move-candidates.json
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: ${{ steps.build.conclusion == 'success' && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: move-candidates
          path: move-candidates.json
          retention-days: 90
          if-no-files-found: ignore
