[package]
name = "pipeline"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
domain = { version = "0.1.0", path = "../domain" }
entity = { version = "0.1.0", path = "../entity" }
reqwest = { version = "0.13", default-features = false, features = ["brotli", "deflate", "gzip", "rustls"] }
sea-orm = { version = "2", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-json", "with-chrono", "postgres-array"] }
serde_json = "1"
texting_robots = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
url = "2"

[dev-dependencies]
axum = "0.8"
futures-util = "0.3"
migration = { path = "../migration" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
